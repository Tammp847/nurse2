<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองเวรพยาบาลออนไลน์</title>
    <!-- Tailwind CSS & Flowbite / FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .shift-morning { background-color: #fef3c7; color: #92400e; }
        .shift-afternoon { background-color: #e0f2fe; color: #075985; }
        .shift-night { background-color: #f3e8ff; color: #6b21a8; }
        .shift-off { background-color: #f3f4f6; color: #374151; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div class="max-w-7xl mx-auto p-4">
        <!-- Header -->
        <header class="bg-blue-600 text-white p-6 rounded-2xl shadow-lg mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2"><i class="fa-solid fa-user-nurse"></i> ระบบจองเวรพยาบาลออนไลน์</h1>
                <p class="text-blue-100 text-sm mt-1">แสดงผลเรียลไทม์ จำกัดเวรละ 4 คน</p>
            </div>
            <div class="flex items-center gap-2">
                <span id="regStatusBadge" class="px-3 py-1 text-xs font-bold rounded-full bg-green-100 text-green-800">กำลังเปิดลงทะเบียน</span>
                <button onclick="toggleAdminModal(true)" class="bg-blue-800 hover:bg-blue-900 px-4 py-2 rounded-lg text-sm transition font-medium">
                    <i class="fa-solid fa-gear"></i> ผู้ดูแลระบบ
                </button>
            </div>
        </header>

        <!-- Booking Form & Info Section -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-6">
            <!-- Form -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 lg:col-span-1">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-slate-700"><i class="fa-solid fa-pen-to-square"></i> ลงทะเบียนจองเวร</h2>
                <div id="bookingForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">ชื่อ-นามสกุล / ชื่อเล่น</label>
                        <input type="text" id="nurseName" placeholder="ระบุชื่อของคุณ" class="w-full border rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">เลือกวันที่</label>
                        <input type="date" id="shiftDate" class="w-full border rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">เลือกเวร (จำกัด 4 คน/เวร)</label>
                        <select id="shiftType" class="w-full border rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="เช้า">☀️ เวรเช้า (08:00 - 16:00)</option>
                            <option value="บ่าย">⛅ เวรบ่าย (16:00 - 24:00)</option>
                            <option value="ดึก">🌙 เวรดึก (00:00 - 08:00)</option>
                            <option value="OFF">🏖️ OFF (วันหยุด)</option>
                        </select>
                    </div>
                    <button onclick="submitBooking()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition flex justify-center items-center gap-2 shadow-md shadow-blue-200">
                        <i class="fa-solid fa-check"></i> บันทึกการจองเวร
                    </button>
                </div>
                <div id="closedMessage" class="hidden text-center py-8 text-red-500 font-semibold bg-red-50 rounded-xl p-4 border border-red-100">
                    ⚠️ ระบบปิดรับลงทะเบียนในขณะนี้
                </div>
            </div>

            <!-- Calendar Display -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 lg:col-span-3">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold flex items-center gap-2 text-slate-700"><i class="fa-solid fa-calendar-days"></i> ปฏิทินตารางเวรประจำเดือน</h2>
                    <div class="flex gap-2">
                        <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600"><i class="fa-solid fa-chevron-left"></i></button>
                        <span id="currentMonthYear" class="font-bold text-slate-700 min-w-[120px] text-center pt-1"></span>
                        <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>

                <!-- Calendar Grid -->
                <div class="grid grid-cols-7 gap-2 text-center font-semibold text-sm text-slate-500 mb-2">
                    <div>อา.</div><div>จ.</div><div>อ.</div><div>พ.</div><div>พฤ.</div><div>ศ.</div><div>ส.</div>
                </div>
                <div id="calendarGrid" class="grid grid-cols-7 gap-2">
                    <!-- Days injected by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Configuration Modal -->
    <div id="adminModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-lock"></i> เมนูผู้ดูแลระบบ</h3>
                <button onclick="toggleAdminModal(false)" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">รหัสผ่านผู้ดูแลระบบ</label>
                    <input type="password" id="adminPass" placeholder="กรอกรหัสผ่านเพื่อสั่งการ" class="w-full border rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="pt-2 border-t space-y-2">
                    <label class="block text-sm font-medium text-slate-600">จัดการระบบลงทะเบียน</label>
                    <div class="flex gap-2">
                        <button onclick="setRegistrationStatus(true)" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-semibold py-2.5 rounded-xl text-sm transition">เปิดระบบ</button>
                        <button onclick="setRegistrationStatus(false)" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2.5 rounded-xl text-sm transition">ปิดระบบ</button>
                    </div>
                </div>
                <div class="pt-2 border-t">
                    <button onclick="clearAllData()" class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-3 rounded-xl text-sm transition flex justify-center items-center gap-2">
                        <i class="fa-solid fa-trash-can"></i> ล้างข้อมูลตารางเวรทั้งหมด
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Step -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // CONFIG: ตั้งค่า Firebase ของคุณที่นี่
        const firebaseConfig = {
          apiKey: "AIzaSyCHsvdhqucG9byQxZE47AxRb8v4bezVJU0",
          authDomain: "nurse-db-cbc9c.firebaseapp.com",
          databaseURL: "https://nurse-db-cbc9c-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "nurse-db-cbc9c",
          storageBucket: "nurse-db-cbc9c.firebasestorage.app",
          messagingSenderId: "285296416812",
          appId: "1:285296416812:web:224fbb88b399e986bdd989",
          measurementId: "G-LLSP2BJX0V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // State & Constants
        const ADMIN_PASSWORD = "NURSE1234_PASSWORD"; // ตั้งรหัสผ่านจัดการตรงนี้
        let currentUrlDate = new Date();
        let currentMonth = currentUrlDate.getMonth();
        let currentYear = currentUrlDate.getFullYear();
        let allBookings = {};
        let configSystem = { open: true };

        // DOM Elements
        window.toggleAdminModal = (show) => {
            document.getElementById('adminModal').classList.toggle('hidden', !show);
        };

        // Realtime Sync
        onValue(ref(db, 'system_config'), (snapshot) => {
            const val = snapshot.val();
            if (val) {
                configSystem = val;
                document.getElementById('bookingForm').classList.toggle('hidden', !val.open);
                document.getElementById('closedMessage').classList.toggle('hidden', val.open);
                const badge = document.getElementById('regStatusBadge');
                badge.innerText = val.open ? "กำลังเปิดลงทะเบียน" : "ปิดระบบชั่วคราว";
                badge.className = val.open ? "px-3 py-1 text-xs font-bold rounded-full bg-green-100 text-green-800" : "px-3 py-1 text-xs font-bold rounded-full bg-red-100 text-red-800";
            }
        });

        onValue(ref(db, 'bookings'), (snapshot) => {
            allBookings = snapshot.val() || {};
            renderCalendar();
        });

        // Booking Function
        window.submitBooking = () => {
            const name = document.getElementById('nurseName').value.trim();
            const dateStr = document.getElementById('shiftDate').value;
            const shift = document.getElementById('shiftType').value;

            if (!name || !dateStr) {
                alert('กรุณากรอกชื่อและเลือกวันที่ต้องการลงเวรครับ');
                return;
            }

            if (!configSystem.open) {
                alert('ขออภัย ขณะนี้ระบบปิดการลงทะเบียนจองเวรครับ');
                return;
            }

            // นับจำนวนคนที่จองเวรนั้นในวันนั้น
            let count = 0;
            Object.values(allBookings).forEach(b => {
                if (b.date === dateStr && b.shift === shift) count++;
            });

            if (count >= 4) {
                alert(`ขออภัยครับ เวร${shift} ของวันที่ ${dateStr} เต็ม 4 คนแล้วครับ!`);
                return;
            }

            const newBookingRef = push(ref(db, 'bookings'));
            set(newBookingRef, { name, date: dateStr, shift }).then(() => {
                alert('จองเวรเรียบร้อยแล้วครับ!');
                document.getElementById('nurseName').value = '';
            });
        };

        // Admin Controls
        window.setRegistrationStatus = (isOpen) => {
            if (document.getElementById('adminPass').value !== ADMIN_PASSWORD) return alert('รหัสผ่านไม่ถูกต้อง');
            set(ref(db, 'system_config'), { open: isOpen }).then(() => {
                alert(`เปลี่ยนสถานะระบบเป็น: ${isOpen ? 'เปิด' : 'ปิด'} เรียบร้อย`);
                toggleAdminModal(false);
            });
        };

        window.clearAllData = () => {
            if (document.getElementById('adminPass').value !== ADMIN_PASSWORD) return alert('รหัสผ่านไม่ถูกต้อง');
            if (confirm('คุณต้องการล้างตารางเวรทั้งหมดใช่หรือไม่? ข้อมูลจะหายถาวร!')) {
                remove(ref(db, 'bookings')).then(() => {
                    alert('ล้างข้อมูลตารางเวรทั้งหมดเรียบร้อยแล้วครับ');
                    toggleAdminModal(false);
                });
            }
        };

        // Calendar Render Engine
        window.changeMonth = (dir) => {
            currentMonth += dir;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar();
        };

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            document.getElementById('currentMonthYear').innerText = `${monthNames[currentMonth]} ${currentYear + 543}`;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            // เติมช่องว่างวันก่อนหน้า
            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            // สร้างวันในเดือน
            for (let day = 1; day <= daysInMonth; day++) {
                const dayBox = document.createElement('div');
                dayBox.className = "bg-slate-50 border border-slate-100 rounded-xl p-2 min-h-[110px] text-left flex flex-col justify-between";
                
                const dayNum = document.createElement('span');
                dayNum.className = "font-bold text-xs text-slate-400 block mb-1";
                dayNum.innerText = day;
                dayBox.appendChild(dayNum);

                const listContainer = document.createElement('div');
                listContainer.className = "space-y-1 overflow-y-auto max-h-[85px] text-[10px]";

                // Format วันเป็น YYYY-MM-DD
                const currentFormatDate = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

                // ดึงรายชื่อมาพ่นลงกล่องวัน
                Object.values(allBookings).forEach(b => {
                    if (b.date === currentFormatDate) {
                        const row = document.createElement('div');
                        let shiftClass = 'shift-morning';
                        if(b.shift === 'บ่าย') shiftClass = 'shift-afternoon';
                        if(b.shift === 'ดึก') shiftClass = 'shift-night';
                        if(b.shift === 'OFF') shiftClass = 'shift-off';

                        row.className = `px-1.5 py-0.5 rounded font-medium truncate ${shiftClass}`;
                        row.innerText = `[${b.shift}] ${b.name}`;
                        listContainer.appendChild(row);
                    }
                });

                dayBox.appendChild(listContainer);
                grid.appendChild(dayBox);
            }
        }

        // Init
        document.getElementById('shiftDate').value = new Date().toISOString().split('T')[0];
        renderCalendar();
    </script>
</body>
</html>
